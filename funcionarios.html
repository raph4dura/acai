/* =====================================================
   CONFIGURAÇÃO
===================================================== */


let pedidosAtuais = [];

let idsConhecidos = new Set();

let primeiraCarga = true;

let carregando = false;


/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */


function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString(
            "pt-BR",
            {
                style:"currency",
                currency:"BRL"
            }
        );

}


function escapar(valor){

    return String(valor ?? "")
        .replace(
            /[&<>"']/g,
            function(caractere){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[caractere];

            }
        );

}


/* =====================================================
   STATUS
===================================================== */


function nomeStatus(status){

    if(status === "novo"){

        return "Novo pedido";

    }

    if(status === "em_preparo"){

        return "Em preparo";

    }

    if(status === "pronto"){

        return "Pronto";

    }

    return status || "Novo pedido";

}


/* =====================================================
   BUSCAR ITENS
===================================================== */


async function buscarItens(pedidoId){

    const resposta = await fetch(

        "/api/itens?pedido_id="
        +
        encodeURIComponent(pedidoId)
        +
        "&t="
        +
        Date.now(),

        {
            cache:"no-store"
        }

    );


    if(!resposta.ok){

        return [];

    }


    const dados =
        await resposta
            .json();


    return dados.itens || [];

}


/* =====================================================
   CARREGAR PEDIDOS
===================================================== */


async function carregarPedidos(manual=false){

    if(carregando){

        return;

    }


    carregando=true;


    try{

        const resposta =

            await fetch(

                "/api/pedidos?t="
                +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!resposta.ok){

            throw new Error(
                "Não foi possível acessar os pedidos."
            );

        }


        const dados =
            await resposta.json();


        let pedidos =
            Array.isArray(dados)
                ?
                dados
                :
                (
                    dados.pedidos
                    ||
                    []
                );


        /*
         * SOMENTE PEDIDOS QUE AINDA
         * NÃO FORAM FINALIZADOS
         */

        pedidos =
            pedidos.filter(

                pedido =>
                    pedido.status !== "pronto"

            );


        /*
         * MAIS RECENTES PRIMEIRO
         */

        pedidos.sort(

            (a,b)=>
                new Date(
                    b.criado_em || 0
                )
                -
                new Date(
                    a.criado_em || 0
                )

        );


        /*
         * VERIFICA NOVOS PEDIDOS
         */

        const novosIds =
            new Set(
                pedidos.map(
                    p=>String(p.id)
                )
            );


        let apareceuPedidoNovo=false;


        if(!primeiraCarga){

            for(const id of novosIds){

                if(!idsConhecidos.has(id)){

                    apareceuPedidoNovo=true;

                    break;

                }

            }

        }


        idsConhecidos =
            novosIds;

        primeiraCarga=false;


        pedidosAtuais =
            pedidos;


        /*
         * RENDERIZA
         */

        await renderizarPedidos(
            pedidos,
            apareceuPedidoNovo
        );


        /*
         * STATUS DA CONEXÃO
         */

        document
            .getElementById("statusConexao")
            .textContent =

            "🟢 Atualização automática ativa • Última atualização: "
            +
            new Date()
                .toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit"
                    }
                );


    }catch(erro){

        console.error(
            "Erro ao carregar pedidos:",
            erro
        );


        document
            .getElementById("statusConexao")
            .textContent =
            "🔴 Não foi possível atualizar os pedidos.";


        if(manual){

            document
                .getElementById("listaPedidos")
                .innerHTML =

                `

                <div class="erro">

                ❌

                <br><br>

                ${escapar(erro.message)}

                <br><br>

                Verifique se as APIs
                <strong>/api/pedidos</strong>
                e
                <strong>/api/itens</strong>
                estão funcionando.

                </div>

                `;

        }

    }finally{

        carregando=false;

    }

}


/* =====================================================
   RENDERIZAR
===================================================== */


async function renderizarPedidos(
    pedidos,
    temNovoPedido=false
){

    const container =
        document.getElementById(
            "listaPedidos"
        );


    if(!pedidos.length){

        container.innerHTML =

            `

            <div class="vazio">

                <div class="icone">
                    🍧
                </div>

                <h3>
                    Tudo em dia!
                </h3>

                <p>
                    Não há pedidos aguardando preparo.
                </p>

            </div>

            `;

        return;

    }


    /*
     * BUSCA OS ITENS DOS PEDIDOS
     */

    const cards = await Promise.all(

        pedidos.map(
            async pedido => {

                const itens =
                    await buscarItens(
                        pedido.id
                    );


                return montarPedido(
                    pedido,
                    itens,
                    temNovoPedido
                );

            }
        )

    );


    container.innerHTML =
        cards.join("");

}


/* =====================================================
   MONTAR PEDIDO
===================================================== */


function montarPedido(
    pedido,
    itens,
    temNovoPedido
){

    const status =
        pedido.status || "novo";


    const data =
        pedido.criado_em
            ?
            new Date(
                pedido.criado_em
            )
            :
            null;


    const horario =
        data
            ?
            data.toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
            :
            "";


    const classeNovo =

        temNovoPedido &&
        status === "novo"

            ?
            "novo-pedido"

            :
            "";


    const itensHTML =

        itens.length

        ?

        itens.map(item => `

            <div class="item">

                <div class="item-nome">

                    ${escapar(item.quantidade)}
                    x
                    ${escapar(item.produto)}

                </div>


                ${
                    item.detalhes
                    ?
                    `

                    <div class="item-detalhes">

                        ${escapar(
                            item.detalhes
                        )}

                    </div>

                    `
                    :
                    ""
                }


                <div class="item-preco">

                    ${dinheiro(
                        Number(item.preco || 0)
                        *
                        Number(item.quantidade || 1)
                    )}

                </div>

            </div>

        `).join("")

        :

        `

        <div class="item-detalhes">

            Nenhum item encontrado.

        </div>

        `;


    let botoes="";


    if(status === "novo"){

        botoes = `

        <button
            class="btn btn-preparo"
            onclick="alterarStatus(
                ${pedido.id},
                'em_preparo'
            )"
        >

            👨‍🍳 Iniciar preparo

        </button>

        `;

    }


    if(status === "em_preparo"){

        botoes = `

        <button
            class="btn btn-pronto"
            onclick="alterarStatus(
                ${pedido.id},
                'pronto'
            )"
        >

            ✅ Marcar como pronto

        </button>

        `;

    }


    return `

    <article
        class="pedido ${classeNovo}"
    >


        <div class="pedido-header">


            <div>

                <div class="numero">

                    Pedido
                    #${escapar(
                        pedido.numero_pedido
                    )}

                </div>


                <div class="mesa">

                    🪑 Mesa
                    <strong>
                        ${escapar(
                            pedido.mesa
                        )}
                    </strong>

                </div>

            </div>


            <div
                class="status status-${escapar(
                    status
                )}"
            >

                ${nomeStatus(status)}

            </div>


        </div>


        <div class="itens">

            ${itensHTML}

        </div>


        <div class="informacoes">

            💳
            <strong>
                ${escapar(
                    pedido.pagamento
                    ||
                    "Não informado"
                )}
            </strong>


            ${
                horario
                ?
                `
                <br>

                🕐
                ${horario}
                `
                :
                ""
            }

        </div>


        ${
            pedido.observacao
            ?
            `

            <div class="observacao">

                📝

                <strong>
                    Observação:
                </strong>

                ${escapar(
                    pedido.observacao
                )}

            </div>

            `
            :
            ""
        }


        <div class="total">

            <span>
                Total
            </span>

            <strong>

                ${dinheiro(
                    pedido.total
                )}

            </strong>

        </div>


        <div class="acoes">

            ${botoes}

        </div>


    </article>

    `;

}


/* =====================================================
   ALTERAR STATUS
===================================================== */



async function alterarStatus(pedidoId, novoStatus) {
    try {
        let pin = null;

        if (novoStatus === "em_preparo") {
            pin = prompt("Digite seu PIN de 4 dígitos:");

            if (pin === null) return;

            if (!/^\d{4}$/.test(pin)) {
                alert("O PIN deve ter exatamente 4 dígitos.");
                return;
            }
        }

        const resposta = await fetch("/api/status", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: pedidoId,
                status: novoStatus,
                pin: pin
            })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            throw new Error(
                dados.erro || "Não foi possível alterar o status."
            );
        }

        await carregarPedidos(true);

    } catch (erro) {
        console.error(erro);

        alert(
            erro.message || "Erro ao alterar pedido."
        );
    }
}

        /*
         * ATUALIZA IMEDIATAMENTE
         */

        await carregarPedidos(true);


    }catch(erro){

        console.error(
            erro
        );


        alert(
            erro.message
            ||
            "Erro ao alterar pedido."
        );

    }

}


/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */


/*
 * O painel consulta a API a cada 2 segundos.
 *
 * Assim, quando o cliente finalizar um pedido,
 * ele aparece automaticamente aqui.
 */

carregarPedidos(true);


setInterval(

    function(){

        carregarPedidos(false);

    },

    2000

);

</script></body></html>
