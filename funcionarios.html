
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b21b6">
<title>Funcionários — Cantinho do Açaí</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f3f8;
    color: #241735;
}

header {
    background: linear-gradient(135deg, #5b21b6, #7c3aed);
    color: white;
    padding: 20px 16px;
    box-shadow: 0 4px 18px #0002;
}

.header, main {
    max-width: 1000px;
    margin: auto;
}

header h1 {
    font-size: 23px;
}

header p {
    margin-top: 5px;
    opacity: .85;
}

main {
    padding: 18px 14px 50px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.top h2 {
    color: #32184f;
}

.btn {
    border: 0;
    border-radius: 12px;
    padding: 11px 14px;
    background: #6d28d9;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.btn:hover {
    background: #5b21b6;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.statusbar {
    background: white;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px #0000000d;
    font-size: 13px;
    color: #6b7280;
}

.pedido {
    background: white;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px #00000010;
    border-left: 5px solid #7c3aed;
}

.pedido-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.numero {
    font-size: 18px;
    font-weight: bold;
    color: #32184f;
}

.mesa {
    margin-top: 6px;
    color: #5b5264;
    font-size: 14px;
}

.status {
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.status-novo {
    background: #ede9fe;
    color: #5b21b6;
}

.status-em_preparo {
    background: #fef3c7;
    color: #92400e;
}

.itens {
    margin-top: 15px;
    padding-top: 10px;
    border-top: 1px solid #eee;
}

.item {
    padding: 10px 0;
    border-bottom: 1px solid #f0edf3;
}

.item:last-child {
    border-bottom: 0;
}

.item-nome {
    font-weight: bold;
    color: #34203f;
}

.item-detalhes {
    font-size: 12px;
    color: #7b7280;
    margin-top: 4px;
    line-height: 1.4;
}

.item-preco {
    margin-top: 4px;
    font-size: 13px;
    color: #6d28d9;
}

.informacoes {
    margin-top: 13px;
    font-size: 13px;
    color: #5b5264;
    line-height: 1.6;
}

.observacao {
    margin-top: 10px;
    padding: 11px;
    background: #faf5ff;
    border-radius: 11px;
    color: #4c1d95;
    font-size: 13px;
}

.total {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #ddd6e5;
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    color: #5b21b6;
}

.acoes {
    display: flex;
    gap: 9px;
    margin-top: 14px;
}

.btn-preparo {
    background: #f59e0b;
}

.btn-preparo:hover {
    background: #d97706;
}

.btn-pronto {
    background: #16a34a;
}

.btn-pronto:hover {
    background: #15803d;
}

.vazio, .erro {
    border-radius: 18px;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 3px 12px #0000000d;
}

.vazio {
    background: white;
    color: #6b7280;
}

.vazio .icone {
    font-size: 48px;
    margin-bottom: 12px;
}

.vazio h3 {
    color: #4c1d95;
    margin-bottom: 6px;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
}

.novo-pedido {
    animation: aparecer .7s ease;
}

@keyframes aparecer {
    0% { transform: scale(.98); opacity: .4; }
    100% { transform: scale(1); opacity: 1; }
}

@media (max-width: 600px) {
    .top {
        align-items: flex-start;
    }

    .pedido-header {
        flex-direction: column;
    }

    .acoes {
        flex-direction: column;
    }

    .acoes .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <h1>🥤 Cantinho do Açaí</h1>
        <p>Painel dos funcionários</p>
    </div>
</header>

<main>
    <div class="top">
        <h2>Pedidos</h2>
        <button class="btn" onclick="carregarPedidos(true)">
            🔄 Atualizar
        </button>
    </div>

    <div class="statusbar" id="statusConexao">
        🔄 Conectando ao sistema...
    </div>

    <div id="listaPedidos"></div>
</main>

<script>
let idsConhecidos = new Set();
let primeiraCarga = true;
let carregando = false;

function dinheiro(valor) {
    return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function escapar(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[caractere]);
}

function nomeStatus(status) {
    const nomes = {
        novo: "Novo pedido",
        em_preparo: "Em preparo",
        pronto: "Pronto"
    };

    return nomes[status] || status || "Novo pedido";
}

async function buscarItens(pedidoId) {
    try {
        const resposta = await fetch(
            "/api/itens?pedido_id=" +
            encodeURIComponent(pedidoId) +
            "&t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!resposta.ok) {
            console.error("Erro ao buscar itens:", resposta.status);
            return [];
        }

        const dados = await resposta.json();
        return dados.itens || [];

    } catch (erro) {
        console.error("Erro ao buscar itens:", erro);
        return [];
    }
}

async function carregarPedidos(manual = false) {
    if (carregando) return;

    carregando = true;

    try {
        const resposta = await fetch(
            "/api/pedidos?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!resposta.ok) {
            throw new Error(
                "A API de pedidos respondeu com erro HTTP " +
                resposta.status + "."
            );
        }

        const dados = await resposta.json();

        let pedidos = Array.isArray(dados)
            ? dados
            : (dados.pedidos || []);

        pedidos = pedidos.filter(
            pedido => pedido.status !== "pronto"
        );

        pedidos.sort((a, b) =>
            new Date(b.criado_em || 0) -
            new Date(a.criado_em || 0)
        );

        const novosIds = new Set(
            pedidos.map(pedido => String(pedido.id))
        );

        let apareceuPedidoNovo = false;

        if (!primeiraCarga) {
            for (const id of novosIds) {
                if (!idsConhecidos.has(id)) {
                    apareceuPedidoNovo = true;
                    break;
                }
            }
        }

        idsConhecidos = novosIds;
        primeiraCarga = false;

        await renderizarPedidos(pedidos, apareceuPedidoNovo);

        document.getElementById("statusConexao").textContent =
            "🟢 Atualização automática ativa • Última atualização: " +
            new Date().toLocaleTimeString("pt-BR");

    } catch (erro) {
        console.error("Erro ao carregar pedidos:", erro);

        document.getElementById("statusConexao").textContent =
            "🔴 Não foi possível atualizar os pedidos.";

        if (manual) {
            document.getElementById("listaPedidos").innerHTML = `
                <div class="erro">
                    ❌<br><br>
                    ${escapar(erro.message)}
                    <br><br>
                    Verifique se a API <strong>/api/pedidos</strong>
                    está funcionando.
                </div>
            `;
        }
    } finally {
        carregando = false;
    }
}

async function renderizarPedidos(pedidos, temNovoPedido = false) {
    const container = document.getElementById("listaPedidos");

    if (!pedidos.length) {
        container.innerHTML = `
            <div class="vazio">
                <div class="icone">🍧</div>
                <h3>Tudo em dia!</h3>
                <p>Não há pedidos aguardando preparo.</p>
            </div>
        `;
        return;
    }

    const cards = await Promise.all(
        pedidos.map(async pedido => {
            const itens = await buscarItens(pedido.id);
            return montarPedido(pedido, itens, temNovoPedido);
        })
    );

    container.innerHTML = cards.join("");
}

function montarPedido(pedido, itens, temNovoPedido) {
    const status = pedido.status || "novo";

    const data = pedido.criado_em
        ? new Date(pedido.criado_em)
        : null;

    const horario = data && !Number.isNaN(data.getTime())
        ? data.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
        })
        : "";

    const classeNovo =
        temNovoPedido && status === "novo"
            ? "novo-pedido"
            : "";

    const itensHTML = itens.length
        ? itens.map(item => `
            <div class="item">
                <div class="item-nome">
                    ${escapar(item.quantidade)} x
                    ${escapar(item.produto)}
                </div>

                ${item.detalhes ? `
                    <div class="item-detalhes">
                        ${escapar(item.detalhes)}
                    </div>
                ` : ""}

                <div class="item-preco">
                    ${dinheiro(
                        Number(item.preco || 0) *
                        Number(item.quantidade || 1)
                    )}
                </div>
            </div>
        `).join("")
        : `<div class="item-detalhes">Nenhum item encontrado.</div>`;

    let botoes = "";

    if (status === "novo") {
        botoes = `
            <button class="btn btn-preparo"
                onclick="alterarStatus(${Number(pedido.id)}, 'em_preparo')">
                👨‍🍳 Iniciar preparo
            </button>
        `;
    } else if (status === "em_preparo") {
        botoes = `
            <button class="btn btn-pronto"
                onclick="alterarStatus(${Number(pedido.id)}, 'pronto')">
                ✅ Marcar como pronto
            </button>
        `;
    }

    return `
        <article class="pedido ${classeNovo}">
            <div class="pedido-header">
                <div>
                    <div class="numero">
                        Pedido #${escapar(pedido.numero_pedido)}
                    </div>
                    <div class="mesa">
                        🪑 Mesa <strong>${escapar(pedido.mesa)}</strong>
                    </div>
                </div>

                <div class="status status-${escapar(status)}">
                    ${escapar(nomeStatus(status))}
                </div>
            </div>

            <div class="itens">${itensHTML}</div>

            <div class="informacoes">
                💳 <strong>${escapar(pedido.pagamento || "Não informado")}</strong>
                ${horario ? `<br>🕐 ${escapar(horario)}` : ""}
            </div>

            ${pedido.observacao ? `
                <div class="observacao">
                    📝 <strong>Observação:</strong>
                    ${escapar(pedido.observacao)}
                </div>
            ` : ""}

            <div class="total">
                <span>Total</span>
                <strong>${dinheiro(pedido.total)}</strong>
            </div>

            <div class="acoes">${botoes}</div>
        </article>
    `;
}

async function alterarStatus(pedidoId, novoStatus) {
    try {
        let pin = null;

        if (novoStatus === "em_preparo") {
            pin = prompt("Digite seu PIN de 4 dígitos:");

            if (pin === null) return;

            if (!/^\d{4}$/.test(pin)) {
                alert("O PIN deve ter exatamente 4 dígitos.");
                return;
            }
        }

        const resposta = await fetch("/api/status", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: pedidoId,
                status: novoStatus,
                pin: pin
            })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
            throw new Error(
                dados.erro || "Não foi possível alterar o status."
            );
        }

        await carregarPedidos(true);

    } catch (erro) {
        console.error("Erro ao alterar pedido:", erro);

        alert(
            erro.message || "Erro ao alterar pedido."
        );
    }
}

carregarPedidos(true);

setInterval(() => {
    carregarPedidos(false);
}, 2000);
</script>

</body>
</html>
